[project]
name = "specops-tools"
version = "0.1.0"
description = "Utilities for the SpecOps skill pack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
yaml = [
  "PyYAML>=6.0.2",
]

[project.scripts]
specops-interview = "specops_tools.interview_cli:main"
specops-interview-replay = "specops_tools.interview_replay:main"
specops-ucp = "specops_tools.ucp_cli:main"
specops-render = "specops_tools.render_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specops_tools"]

[tool.uv]
package = true
